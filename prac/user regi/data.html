<!-- ====================== data.html ====================== -->

<!DOCTYPE html>
<html>

<head>

    <title>User Data</title>

    <style>

        body {
            font-family: Arial;
            background: #f0f0f0;
            padding: 20px;
        }

        table {
            width: 100%;
            background: white;
            border-collapse: collapse;
        }

        th,
        td {
            border: 1px solid black;
            padding: 10px;
            text-align: center;
        }

    </style>

</head>

<body>

    <h2>Registered Users</h2>

    <table>

        <tr>
            <th>Name</th>
            <th>Email</th>
            <th>Password</th>
        </tr>

        <tbody id="data"></tbody>

    </table>

    <script>

        let users = JSON.parse(localStorage.getItem("users")) || [];

        let output = "";

        users.forEach(function (user) {

            output += `
            <tr>
                <td>${user.name}</td>
                <td>${user.email}</td>
                <td>${user.password}</td>
            </tr>
            `;

        });

        document.getElementById("data").innerHTML = output;

    </script>

</body>

</html>
