<!DOCTYPE html>
<html>
<head>
    <title>College Admin Dashboard</title>

    <style>

        /* Page Background */
        body {
            margin: 0;
            font-family: Arial;
            background-color: #f0f0f0;
        }

        /* Main Container */
        .container {
            display: flex;
        }

        /* Sidebar */
        .sidebar {
            width: 220px;
            height: 100vh;
            background-color: #222;
            color: white;
            padding: 20px;
        }

        .sidebar h2 {
            text-align: center;
        }

        .sidebar a {
            display: block;
            color: white;
            text-decoration: none;
            padding: 10px;
            margin-top: 10px;
            background-color: #333;
            border-radius: 5px;
        }

        .sidebar a:hover {
            background-color: #555;
        }

        /* Main Content */
        .main {
            flex: 1;
            padding: 20px;
        }

        /* Card Section */
        .cards {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }

        /* Single Card */
        .card {
            width: 200px;
            padding: 20px;
            color: white;
            border-radius: 10px;
            text-align: center;
        }

        .blue {
            background-color: blue;
        }

        .green {
            background-color: green;
        }

        .red {
            background-color: red;
        }

        .orange {
            background-color: orange;
            color: black;
        }

        /* Responsive Design */
        @media (max-width: 700px) {

            .container {
                flex-direction: column;
            }

            .sidebar {
                width: 100%;
                height: auto;
            }

            .cards {
                justify-content: center;
            }

        }

    </style>
</head>

<body>

    <div class="container">

        <!-- Sidebar -->
        <div class="sidebar">

            <h2>Dashboard</h2>

            <a href="#">Home</a>
            <a href="#">Students</a>
            <a href="#">Exams</a>
            <a href="#">Results</a>
            <a href="#">Settings</a>

        </div>

        <!-- Main Content -->
        <div class="main">

            <h1>College Admin Dashboard</h1>

            <div class="cards">

                <div class="card blue">
                    <h2>500</h2>
                    <p>Total Students</p>
                </div>

                <div class="card green">
                    <h2>25</h2>
                    <p>Total Teachers</p>
                </div>

                <div class="card red">
                    <h2>12</h2>
                    <p>Upcoming Exams</p>
                </div>

                <div class="card orange">
                    <h2>95%</h2>
                    <p>Pass Percentage</p>
                </div>

            </div>

        </div>

    </div>

</body>
</html>
